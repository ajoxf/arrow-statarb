<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nexus{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <!-- Bootstrap 5 CSS — vendored locally (served by the app) so the dashboard
         renders on a locked-down/offline box with no CDN access. -->
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (CSS + woff2 font under /static/vendor/fonts/) -->
    <link href="/static/vendor/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js (UMD, self-contained) -->
    <script src="/static/vendor/chart.umd.min.js"></script>
    <script src="/static/candles_chart.js"></script>

    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #e9ecef;
            --border-color: #dee2e6;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --accent-green: #198754;
            --accent-red: #dc3545;
            --accent-blue: #0d6efd;
            --accent-yellow: #ffc107;
            --accent-purple: #6f42c1;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--bg-secondary) !important;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-brand {
            font-weight: 600;
            color: var(--text-primary) !important;
        }

        .nav-link {
            color: var(--text-secondary) !important;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-primary) !important;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .card-header {
            background-color: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-body {
            color: var(--text-primary);
        }

        .form-control, .form-select {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--bg-primary);
            border-color: var(--accent-blue);
            color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
        }

        .form-control::placeholder {
            color: var(--text-secondary);
        }

        .btn-primary {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #157347;
            border-color: #146c43;
        }

        .btn-danger {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff;
        }

        .btn-outline-secondary {
            color: var(--text-secondary);
            border-color: var(--border-color);
        }

        .btn-outline-secondary:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .table {
            color: var(--text-primary);
        }

        /* This app is a LIGHT theme, but several tables carry Bootstrap's
           .table-dark. Overriding --bs-table-bg/-color alone was not
           enough: .table-dark also ships near-black STRIPED, HOVER and
           ACTIVE colours, and Bootstrap 5.3 paints those over the cell
           with an inset box-shadow. The result was black bands with dark
           text on them — unreadable (operator, 2026-08-06). Every state
           colour has to be brought into the light theme, not just the
           base one. */
        .table-dark {
            --bs-table-bg: var(--bg-secondary);
            --bs-table-color: var(--text-primary);
            --bs-table-border-color: var(--border-color);
            --bs-table-striped-bg: var(--bg-tertiary);
            --bs-table-striped-color: var(--text-primary);
            --bs-table-hover-bg: var(--bg-tertiary);
            --bs-table-hover-color: var(--text-primary);
            --bs-table-active-bg: var(--bg-tertiary);
            --bs-table-active-color: var(--text-primary);
        }

        .table-dark th, .table-dark td {
            color: var(--text-primary);
        }

        /* --bs-table-bg-type / --bs-table-color-type are the exact hooks
           Bootstrap 5.3 reads for the striped box-shadow, so setting them
           here fixes the band whatever variant the table carries. */
        .table-striped > tbody > tr:nth-of-type(odd) > * {
            --bs-table-bg-type: var(--bg-tertiary);
            --bs-table-color-type: var(--text-primary);
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        /* Muted text keeps its own colour inside a striped band, so it
           must stay legible against the light stripe rather than against
           the dark one it was picked for. */
        .table-dark .text-secondary,
        .table-striped .text-secondary {
            color: var(--text-secondary) !important;
        }

        .badge-long {
            background-color: var(--accent-green) !important;
            color: #fff !important;
        }

        .badge-short {
            background-color: var(--accent-red) !important;
            color: #fff !important;
        }

        .price-up {
            color: var(--accent-green) !important;
            font-weight: 600;
        }

        .price-down {
            color: var(--accent-red) !important;
            font-weight: 600;
        }

        .price-neutral {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Large price display */
        .price-large {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        .price-medium {
            font-size: 1.4rem;
            font-weight: 600;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        /* Account info styles */
        .account-card {
            border-left: 4px solid var(--accent-blue);
        }

        .account-connected {
            border-left-color: var(--accent-green);
        }

        .account-disconnected {
            border-left-color: var(--accent-red);
        }

        .balance-positive {
            color: var(--accent-green) !important;
        }

        .balance-negative {
            color: var(--accent-red) !important;
        }

        .status-connected {
            color: var(--accent-green);
        }

        .status-disconnected {
            color: var(--text-secondary);
        }

        .status-error {
            color: var(--accent-red);
        }

        .metric-card {
            text-align: center;
            padding: 1rem;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 600;
            font-family: 'Monaco', 'Menlo', monospace;
            color: var(--text-primary);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .zscore-positive {
            color: var(--accent-green) !important;
            font-weight: 700;
        }

        .zscore-negative {
            color: var(--accent-red) !important;
            font-weight: 700;
        }

        .zscore-neutral {
            color: var(--text-secondary);
        }


        .flash {
            animation: flash 0.3s ease-in-out;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Text colors */
        .text-secondary {
            color: var(--text-secondary) !important;
        }

        /* Badge overrides for light theme */
        .bg-secondary {
            background-color: #6c757d !important;
        }

        .bg-success {
            background-color: var(--accent-green) !important;
        }

        .bg-danger {
            background-color: var(--accent-red) !important;
        }

        .bg-warning {
            background-color: var(--accent-yellow) !important;
            color: #000 !important;
        }

        .bg-primary {
            background-color: var(--accent-blue) !important;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="/static/logo-nexus.svg" alt="Nexus" height="32">
                <span class="ms-2 fw-semibold" style="font-size:0.9rem; line-height:1;">Arrow
                    <span class="text-secondary" style="font-size:0.72rem;">· NSE / MCX</span>
                </span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/dashboard">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'settings_page' %}active{% endif %}" href="/settings">
                            <i class="bi bi-gear me-1"></i>Settings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'setup' %}active{% endif %}" href="/">
                            <i class="bi bi-plug me-1"></i>Exchanges
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'analysis_page' %}active{% endif %}" href="/analysis">
                            <i class="bi bi-bar-chart me-1"></i>Analysis
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-secondary" id="connection-status">
                        <i class="bi bi-circle-fill me-1 status-disconnected"></i>Connecting...
                    </span>
                    {% include "_algo_control.html" %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Shared dialog: every confirmation and every save result. -->
    <div class="modal fade" id="appDialogModal" tabindex="-1"
         aria-labelledby="appDialogLabel" aria-modal="true" role="dialog">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header py-3">
                    <div class="d-flex align-items-center gap-2">
                        <i id="appDialogIcon" class="bi fs-5"></i>
                        <h6 class="modal-title mb-0 fw-semibold" id="appDialogLabel"></h6>
                    </div>
                    <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="modal" aria-label="Cancel"></button>
                </div>
                <div class="modal-body px-4 py-3" id="appDialogBody"></div>
                <div class="modal-footer border-top-0 pt-0 px-4 pb-3 gap-2">
                    <button type="button" class="btn btn-sm btn-secondary px-3"
                            data-bs-dismiss="modal" id="appDialogCancel">Cancel</button>
                    <button type="button" class="btn btn-sm px-3 fw-semibold"
                            id="appDialogConfirm">OK</button>
                </div>
            </div>
        </div>
    </div>

    <main class="container-fluid py-3">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS — vendored locally (offline-capable) -->
    <script src="/static/vendor/bootstrap.bundle.min.js"></script>
    <!-- Socket.IO client — vendored locally (offline-capable) -->
    <script src="/static/vendor/socket.io.min.js"></script>

    <script>
        // ── Notifications ─────────────────────────────────────────────
        // Toasts stack in one container, carry an icon and a title, and
        // can be dismissed. Errors do NOT auto-hide: a failure that
        // vanishes after three seconds is a failure the operator misses.
        const TOAST_STYLE = {
            success: {icon: 'bi-check-circle-fill', title: 'Success',   ms: 4000},
            danger:  {icon: 'bi-x-octagon-fill',    title: 'Error',     ms: 0},
            warning: {icon: 'bi-exclamation-triangle-fill', title: 'Warning', ms: 8000},
            info:    {icon: 'bi-info-circle-fill',  title: 'Notice',    ms: 5000},
        };

        function toastContainer() {
            let el = document.getElementById('app-toast-container');
            if (!el) {
                el = document.createElement('div');
                el.id = 'app-toast-container';
                el.className = 'toast-container position-fixed bottom-0 end-0 p-3';
                el.style.zIndex = 1090;
                document.body.appendChild(el);
            }
            return el;
        }

        function showToast(message, type = 'info', title = null) {
            const style = TOAST_STYLE[type] || TOAST_STYLE.info;
            const toast = document.createElement('div');
            toast.className = `toast show align-items-start border-0 shadow mb-2 text-bg-${type}`;
            toast.setAttribute('role', type === 'danger' ? 'alert' : 'status');
            toast.setAttribute('aria-live', type === 'danger' ? 'assertive' : 'polite');

            const header = document.createElement('div');
            header.className = 'toast-header';
            const icon = document.createElement('i');
            icon.className = `bi ${style.icon} me-2 text-${type}`;
            const strong = document.createElement('strong');
            strong.className = 'me-auto';
            strong.textContent = title || style.title;
            const close = document.createElement('button');
            close.type = 'button';
            close.className = 'btn-close';
            close.setAttribute('aria-label', 'Dismiss');
            close.addEventListener('click', () => toast.remove());
            header.append(icon, strong, close);

            const body = document.createElement('div');
            body.className = 'toast-body';
            // textContent, not innerHTML — messages carry broker and
            // server text that must never be parsed as markup.
            body.textContent = message;

            toast.append(header, body);
            toastContainer().appendChild(toast);
            if (style.ms) setTimeout(() => toast.remove(), style.ms);
            return toast;
        }

        // ── Dialogs ───────────────────────────────────────────────────
        // One Bootstrap modal serves every confirmation and every
        // save result, so the app never falls back to the browser's own
        // confirm() chrome. Returns a Promise<boolean>.
        const DIALOG_STYLE = {
            success: {icon: 'bi-check-circle-fill', header: 'bg-success text-white', btn: 'btn-success'},
            danger:  {icon: 'bi-x-octagon-fill', header: 'bg-danger text-white', btn: 'btn-danger'},
            warning: {icon: 'bi-exclamation-triangle-fill', header: 'bg-warning text-dark', btn: 'btn-warning'},
            info:    {icon: 'bi-info-circle-fill', header: 'bg-primary text-white', btn: 'btn-primary'},
        };

        function showDialog(opts) {
            const o = Object.assign({
                title: 'Confirm', message: '', details: null, variant: 'info',
                confirmText: 'OK', cancelText: 'Cancel', showCancel: true,
            }, opts || {});
            const style = DIALOG_STYLE[o.variant] || DIALOG_STYLE.info;
            const modalEl = document.getElementById('appDialogModal');

            modalEl.querySelector('.modal-header').className =
                'modal-header py-3 ' + style.header;
            modalEl.querySelector('#appDialogIcon').className = 'bi fs-5 ' + style.icon;
            modalEl.querySelector('#appDialogLabel').textContent = o.title;

            const body = modalEl.querySelector('#appDialogBody');
            body.textContent = '';
            o.message.split('\n').forEach(line => {
                const p = document.createElement('p');
                p.className = 'mb-2';
                p.textContent = line;
                body.appendChild(p);
            });
            if (o.details) {
                const pre = document.createElement('pre');
                pre.className = 'small text-secondary bg-body-tertiary ' +
                                'rounded p-2 mb-0 mt-2';
                pre.style.whiteSpace = 'pre-wrap';
                pre.textContent = o.details;
                body.appendChild(pre);
            }

            const cancelBtn = modalEl.querySelector('#appDialogCancel');
            cancelBtn.textContent = o.cancelText;
            cancelBtn.style.display = o.showCancel ? '' : 'none';
            const confirmBtn = modalEl.querySelector('#appDialogConfirm');
            confirmBtn.className = 'btn btn-sm px-3 fw-semibold ' + style.btn;
            confirmBtn.textContent = o.confirmText;

            // Shown and hidden by hand rather than through
            // bootstrap.Modal. Bootstrap's JS comes from a CDN, and a
            // dialog that reports "could not save" is exactly the thing
            // that must still work when the network is against us.
            // Bootstrap's CSS does the styling; only show/hide is ours.
            return new Promise(resolve => {
                let answer = false;
                const backdrop = document.createElement('div');
                backdrop.className = 'modal-backdrop fade show';

                const close = () => {
                    modalEl.classList.remove('show');
                    modalEl.style.display = 'none';
                    modalEl.removeAttribute('aria-modal');
                    document.body.classList.remove('modal-open');
                    backdrop.remove();
                    document.removeEventListener('keydown', onKey);
                    resolve(answer);
                };
                const onConfirm = () => { answer = true; close(); };
                const onKey = (ev) => {
                    if (ev.key === 'Escape') close();
                    if (ev.key === 'Enter') onConfirm();
                };

                confirmBtn.onclick = onConfirm;
                modalEl.querySelectorAll('[data-bs-dismiss="modal"]')
                       .forEach(el => { el.onclick = close; });
                backdrop.onclick = close;

                document.body.appendChild(backdrop);
                document.body.classList.add('modal-open');
                modalEl.style.display = 'block';
                modalEl.classList.add('show');
                modalEl.setAttribute('aria-modal', 'true');
                document.addEventListener('keydown', onKey);
                setTimeout(() => confirmBtn.focus(), 50);
            });
        }

        // Drop-in replacement for confirm(). Destructive actions pass
        // variant 'danger' so the button colour matches the consequence.
        function showConfirm(message, opts) {
            return showDialog(Object.assign(
                {title: 'Please confirm', message: message, variant: 'warning',
                 confirmText: 'Continue'}, opts || {}));
        }

        // Acknowledgement — one button, no cancel. This is what every
        // save reports through, success or failure.
        function showResult(ok, message, details, title) {
            return showDialog({
                title: title || (ok ? 'Saved' : 'Not saved'),
                message: message,
                details: details || null,
                variant: ok ? 'success' : 'danger',
                confirmText: 'Close', showCancel: false,
            });
        }

        // Every settings save funnels through here so the operator
        // always gets an answer — including the server's notes about
        // changes that need a restart.
        function reportSave(response, data, what) {
            const label = what || 'Settings';
            if (response.ok && data && data.success !== false) {
                const notes = [data.note, data.notes && data.notes.join('\n')]
                    .filter(Boolean).join('\n');
                return showResult(true, label + ' saved.', notes || null);
            }
            const err = (data && (data.error || data.message)) ||
                        ('HTTP ' + response.status);
            return showResult(false, label + ' were not saved.', err);
        }

        // Socket.IO is loaded from a CDN. If that CDN is blocked — a
        // locked-down trading box, an offline machine, a corporate
        // proxy — `io` is undefined and `io()` throws a ReferenceError
        // that kills this ENTIRE script block, taking showToast,
        // showDialog and every save handler defined below with it. The
        // pages already poll as a fallback, so a missing socket must
        // degrade to polling, never break the page.
        // Force the long-polling transport and never attempt a WebSocket
        // upgrade: the app is served by waitress (a plain WSGI server) which
        // cannot hand engine.io a raw socket — an upgrade attempt throws
        // "Cannot obtain socket from WSGI environment" and spams the server
        // log. Polling works fine under waitress and the pages poll REST for
        // their data anyway, so this costs nothing.
        const socket = (typeof io === 'function')
            ? io({ transports: ['polling'], upgrade: false })
            : { on() {}, emit() {}, connected: false, _stub: true };
        if (socket._stub) {
            console.warn('Socket.IO unavailable — falling back to polling.');
            window.addEventListener('DOMContentLoaded', function() {
                updateConnectionStatus('disconnected');
                showToast('Live updates are unavailable, so the page is ' +
                          'polling instead. Values still refresh, just ' +
                          'less often.', 'warning', 'Live feed offline');
            });
        }

        socket.on('connect', function() {
            console.log('Connected to server');
            updateConnectionStatus('connected');
            socket.emit('get_status');
        });

        socket.on('disconnect', function() {
            console.log('Disconnected from server');
            updateConnectionStatus('disconnected');
        });

        socket.on('status', function(data) {
            console.log('Status:', data);
            AlgoCtl.refresh();          // the shared control re-reads the server
            updateConnectionStatus((data.connected || data.is_running) ? 'connected' : 'disconnected');
        });

        socket.on('error', function(data) {
            console.error('Error:', data.message);
            showToast('Error: ' + data.message, 'danger');
        });

        function updateConnectionStatus(status) {
            const el = document.getElementById('connection-status');
            if (status === 'connected') {
                el.innerHTML = '<i class="bi bi-circle-fill me-1 status-connected"></i>Connected';
            } else {
                el.innerHTML = '<i class="bi bi-circle-fill me-1 status-disconnected"></i>Disconnected';
            }
        }

        function formatPrice(price, decimals = 2) {
            if (price === null || price === undefined) return '-';
            return parseFloat(price).toFixed(decimals);
        }

        function formatPercent(value) {
            if (value === null || value === undefined) return '-';
            const prefix = value >= 0 ? '+' : '';
            return prefix + parseFloat(value).toFixed(2) + '%';
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
