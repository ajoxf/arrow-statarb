<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Arrow StatArb{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { padding-bottom: 4rem; }
        .font-monospace { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .metric { font-size: 1.6rem; font-weight: 600; }
        .metric-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--bs-secondary-color); }
        .z-big { font-size: 2.4rem; font-weight: 700; }
        #system-log { height: 220px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: .8rem; }
        .log-entry { white-space: pre-wrap; }
        .log-error { color: var(--bs-danger); }
        .log-warning { color: var(--bs-warning); }
        .log-trade { color: var(--bs-info); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-arrow-left-right me-1"></i>Arrow StatArb
            </a>
            <div class="navbar-nav">
                <a class="nav-link {% block nav_setup %}{% endblock %}" href="/">Setup</a>
                <a class="nav-link {% block nav_dash %}{% endblock %}" href="/dashboard">Dashboard</a>
            </div>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span id="mode-badge" class="badge bg-secondary">—</span>
                <span id="conn-badge" class="badge bg-secondary">Disconnected</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Shared: connection + mode badges (every page).
        async function refreshBadges() {
            try {
                const st = await fetch('/api/arrow/status').then(r => r.json());
                const cb = document.getElementById('conn-badge');
                cb.className = 'badge ' + (st.connected ? 'bg-success' : 'bg-secondary');
                cb.textContent = st.connected
                    ? (st.instruments_ready ? 'Connected' : 'Connecting…') : 'Disconnected';
            } catch (e) {}
            try {
                const cfg = await fetch('/api/config').then(r => r.json());
                const mb = document.getElementById('mode-badge');
                mb.className = 'badge ' + (cfg.dry_run ? 'bg-warning text-dark' : 'bg-danger');
                mb.textContent = cfg.dry_run ? 'DRY-RUN' : 'LIVE';
            } catch (e) {}
        }
        refreshBadges();
        setInterval(refreshBadges, 3000);
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
