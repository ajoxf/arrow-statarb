<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nexus{% endblock %}</title>
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { padding-bottom: 4rem; }
        .font-monospace { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .metric { font-size: 1.6rem; font-weight: 600; }
        .metric-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--bs-secondary-color); }
        .z-big { font-size: 2.4rem; font-weight: 700; }
        #system-log { height: 220px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: .8rem; }
        .log-entry { white-space: pre-wrap; }
        .log-error { color: var(--bs-danger); }
        .log-warning { color: var(--bs-warning); }
        .log-trade { color: var(--bs-info); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-arrow-left-right me-1"></i>Nexus
            </a>
            <div class="navbar-nav">
                <a class="nav-link {% block nav_dash %}{% endblock %}" href="/dashboard">Dashboard</a>
                <a class="nav-link {% block nav_settings %}{% endblock %}" href="/settings">Settings</a>
                <a class="nav-link {% block nav_setup %}{% endblock %}" href="/">Setup</a>
                <a class="nav-link {% block nav_analysis %}{% endblock %}" href="/analysis">Analysis</a>
            </div>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span id="health-badge" class="badge rounded-pill bg-secondary" title="Liveness — loop heartbeat + price feed">health</span>
                <span class="navbar-brand fw-bold me-2 mb-0">
                    <i class="bi bi-arrow-up-right me-1"></i>Arrow
                </span>
                <span id="algo-pill" class="d-flex align-items-center gap-1 small">
                    <span id="algo-dot" class="badge rounded-pill bg-secondary">&nbsp;</span>
                    <span id="algo-pill-text" class="text-secondary">Stopped</span>
                </span>
                <button id="nav-algo-btn" class="btn btn-sm btn-outline-success" onclick="navToggleAlgo()">Start</button>
                <span id="mode-badge" class="badge bg-secondary">—</span>
                <span id="conn-badge" class="badge bg-secondary">Disconnected</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>

    <!-- ── Toasts (transient notifications) ─────────────────────────────────── -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1090">
        <div id="ui-toast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i id="ui-toast-icon" class="bi"></i><span id="ui-toast-msg"></span>
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- ── Reusable confirm / prompt dialog ─────────────────────────────────── -->
    <div class="modal fade" id="ui-dialog" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
                <div class="modal-header">
                    <h5 class="modal-title d-flex align-items-center gap-2">
                        <i id="ui-dialog-icon" class="bi"></i><span id="ui-dialog-title">Confirm</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="ui-dialog-body" class="mb-2"></p>
                    <input id="ui-dialog-input" type="text" class="form-control d-none" autocomplete="off">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" id="ui-dialog-cancel" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="ui-dialog-ok">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/vendor/bootstrap.bundle.min.js"></script>
    <script>
        // ── Professional dialogs (toast + confirm/prompt modal) ──────────────
        // Drop-in replacements for window.alert / confirm / prompt, shared by
        // every page. uiConfirm/uiPrompt return Promises.
        const _UI_VARIANT = {
            success: { cls: 'text-bg-success', icon: 'bi-check-circle-fill', btn: 'btn-success' },
            danger:  { cls: 'text-bg-danger',  icon: 'bi-exclamation-octagon-fill', btn: 'btn-danger' },
            warning: { cls: 'text-bg-warning', icon: 'bi-exclamation-triangle-fill', btn: 'btn-warning' },
            info:    { cls: 'text-bg-secondary', icon: 'bi-info-circle-fill', btn: 'btn-primary' },
        };
        function uiToast(message, variant = 'info') {
            const v = _UI_VARIANT[variant] || _UI_VARIANT.info;
            const el = document.getElementById('ui-toast');
            el.className = 'toast align-items-center border-0 ' + v.cls;
            document.getElementById('ui-toast-icon').className = 'bi ' + v.icon;
            document.getElementById('ui-toast-msg').textContent = message;
            bootstrap.Toast.getOrCreateInstance(el, { delay: 4000 }).show();
        }
        function _uiDialog({ title, body, confirmText = 'Confirm', variant = 'info',
                            withInput = false, placeholder = '', match = null }) {
            const v = _UI_VARIANT[variant] || _UI_VARIANT.info;
            const el = document.getElementById('ui-dialog');
            document.getElementById('ui-dialog-title').textContent = title;
            document.getElementById('ui-dialog-body').innerHTML = body;
            const icon = document.getElementById('ui-dialog-icon');
            icon.className = 'bi ' + v.icon + ' text-' + (variant === 'info' ? 'primary' : variant);
            const ok = document.getElementById('ui-dialog-ok');
            ok.textContent = confirmText;
            ok.className = 'btn ' + v.btn;
            const input = document.getElementById('ui-dialog-input');
            input.classList.toggle('d-none', !withInput);
            input.value = ''; input.placeholder = placeholder;
            if (match) ok.disabled = true;
            const modal = bootstrap.Modal.getOrCreateInstance(el);
            return new Promise(resolve => {
                let done = false;
                const finish = (val) => { if (!done) { done = true; resolve(val); } };
                const onInput = () => { if (match) ok.disabled = (input.value.trim() !== match); };
                const onOk = () => { finish(withInput ? input.value.trim() : true); modal.hide(); };
                const onHide = () => {
                    ok.removeEventListener('click', onOk);
                    input.removeEventListener('input', onInput);
                    el.removeEventListener('hidden.bs.modal', onHide);
                    finish(withInput ? null : false);
                };
                ok.addEventListener('click', onOk);
                input.addEventListener('input', onInput);
                el.addEventListener('hidden.bs.modal', onHide);
                modal.show();
                if (withInput) setTimeout(() => input.focus(), 300);
            });
        }
        function uiConfirm(opts) { return _uiDialog({ ...opts, withInput: false }); }
        function uiPrompt(opts)  { return _uiDialog({ ...opts, withInput: true }); }

        // Shared: connection + mode badges (every page).
        async function refreshBadges() {
            try {
                const st = await fetch('/api/arrow/status').then(r => r.json());
                const cb = document.getElementById('conn-badge');
                cb.className = 'badge ' + (st.connected ? 'bg-success' : 'bg-secondary');
                cb.textContent = st.connected
                    ? (st.instruments_ready ? 'Connected' : 'Connecting…') : 'Disconnected';
            } catch (e) {}
            try {
                const cfg = await fetch('/api/config').then(r => r.json());
                const mb = document.getElementById('mode-badge');
                const m = cfg.mode;
                if (m === 'live') { mb.className = 'badge bg-danger'; mb.textContent = 'LIVE'; }
                else if (m === 'live_sim') { mb.className = 'badge bg-info text-dark'; mb.textContent = 'LIVE-SIM'; }
                else { mb.className = 'badge bg-warning text-dark'; mb.textContent = 'DRY-RUN'; }
            } catch (e) {}
        }
        // Nav Start/Stop reflects the auto-trader, synced across pages.
        async function refreshAlgoPill() {
            try {
                const s = await fetch('/api/algo/state').then(r => r.json());
                const dot = document.getElementById('algo-dot');
                const txt = document.getElementById('algo-pill-text');
                const btn = document.getElementById('nav-algo-btn');
                dot.className = 'badge rounded-pill ' + (s.running ? 'bg-success' : 'bg-secondary');
                txt.textContent = s.running ? 'Running' : 'Stopped';
                btn.textContent = s.running ? 'Stop' : 'Start';
                btn.className = 'btn btn-sm ' + (s.running ? 'btn-outline-danger' : 'btn-outline-success');
            } catch (e) {}
        }
        async function navToggleAlgo() {
            const running = document.getElementById('nav-algo-btn').textContent === 'Stop';
            const ep = running ? '/api/algo/stop' : '/api/algo/start';
            const r = await fetch(ep, { method: 'POST', headers: {'Content-Type':'application/json'},
                                       body: running ? null : JSON.stringify({}) }).then(x => x.json());
            if (!running && !r.success) uiToast('Could not start: ' + (r.error || 'unknown'), 'danger');
            refreshAlgoPill();
        }
        refreshBadges();
        setInterval(refreshBadges, 3000);
        refreshAlgoPill();
        setInterval(refreshAlgoPill, 2000);

        async function refreshHealth() {
            const el = document.getElementById('health-badge');
            if (!el) return;
            try {
                const h = await fetch('/api/health').then(x => x.json());
                if (h.ok) {
                    el.className = 'badge rounded-pill bg-success'; el.textContent = 'healthy';
                } else {
                    el.className = 'badge rounded-pill bg-danger'; el.textContent = 'check';
                }
                el.title = (h.problems && h.problems.length ? h.problems.join(' · ')
                    : `heartbeat ${h.heartbeat_age_sec}s · tick ${h.last_tick_age_sec == null ? '—' : h.last_tick_age_sec + 's'}`);
            } catch (e) { el.className = 'badge rounded-pill bg-secondary'; el.textContent = '—'; }
        }
        refreshHealth();
        setInterval(refreshHealth, 5000);
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
