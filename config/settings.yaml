broker:
  name: arrow
  segments:
    nse_cm: NSECM
    nse_fo: NSEFO
    bse_cm: BSECM
    bse_fo: BSEFO
  exchange_enum:
    nse_cm: NSE
    nse_fo: NFO
    bse_cm: BSE
    bse_fo: BFO
  lot_overrides: {}
instruments:
  leg_a:
    segment: nse_fo
    symbol: NIFTY30JUN26F
    ratio: 1
  leg_b:
    segment: nse_fo
    symbol: NIFTY28JUL26F
    ratio: 1
signal:
  window_minutes: 120
  sample_interval_sec: 0.5
  display_refresh_ms: 50
  min_signal_minutes: 10
  lookback_period: 250
  entry_zscore: 2.0
  exit_zscore: 0.0
  stop_zscore: 4.0
  confirmation_ticks: 3
filters:
  enable_probability_filter: true
  commission_basis: per_lot
  min_win_probability: 0.6
  min_expected_value: 0
  brokerage_per_lot: 10
  slippage_per_lot: 5
  time_stop_half_lives: 3.0
  half_life_min_sec: 0
  half_life_max_sec: 0
risk:
  lots_per_trade: 1
  max_contracts_per_leg: 5
  max_slippage_pct: 0.5
  max_daily_loss: 0
trading_hours:
  enabled: false
  start_hour: 9
  start_min: 15
  end_hour: 15
  end_min: 30
execution:
  product: NRML
  order_type: limit
  default_lots: 1
  cooldown_sec: 300
  use_limit_orders: true
  limit_offset_pct: 0.05
  amend_step_pct: 0.05
  amend_interval_sec: 1.5
  fill_timeout_sec: 5
  poll_interval_sec: 0.4
  limit_to_market: true
  verify_flat_before_entry: true
mode: dry_run
