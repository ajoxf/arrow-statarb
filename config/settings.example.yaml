# Arrow StatArb — configuration TEMPLATE.
#
# This file is the tracked source of defaults. On first run the app copies it to
# config/settings.yaml (which is gitignored and mutated at runtime by the
# Settings page / mode switch), so your live settings never block a git pull.
# Edit defaults here; edit your running config in the UI or in settings.yaml.
#
# Credentials are NEVER stored here — they come from environment variables
# (ARROW_APP_ID, ARROW_USER_ID, ARROW_PASSWORD, ARROW_API_SECRET,
# ARROW_TOTP_SECRET); see .env.example.

broker:
  name: arrow
  # Cache the Arrow session token (valid ~24h) to a gitignored local file so a
  # restart reuses it and skips the 2FA login. Cleared on explicit Disconnect.
  persist_session: true
  # Segment key → Arrow ExchSeg (the master's exchange+segment field).
  segments:
    nse_cm: NSECM
    nse_fo: NSEFO
    bse_cm: BSECM
    bse_fo: BSEFO
  # Segment key → Arrow Exchange enum used on orders/quotes.
  exchange_enum:
    nse_cm: NSE
    nse_fo: NFO
    bse_cm: BSE
    bse_fo: BFO
  lot_overrides: {}

# Default 2-leg spread. The dashboard picker overrides these into
# config/leg_assignments.yaml.
instruments:
  leg_a: { segment: nse_fo, symbol: NIFTY30JUN26F, ratio: 1 }
  leg_b: { segment: nse_fo, symbol: NIFTY28JUL26F, ratio: 1 }

# Signal — the single server-side source of truth (algo AND dashboard read it).
signal:
  window_minutes: 120         # rolling window for mean/std/z (data-collection size)
  sample_interval_sec: 0.5    # how often the server samples prices
  display_refresh_ms: 500     # dashboard live-price poll cadence (min 500ms)
  min_signal_minutes: 30      # history required before any trade (ready gate)
  entry_zscore: 2.0
  exit_zscore: 0.0
  stop_zscore: 4.0
  confirmation_ticks: 3       # consecutive ticks beyond entry before firing
  max_entry_z_divergence: 1.0 # stale-signal guard: refuse an algo entry if the
                              # z re-sampled at order time has moved more than
                              # this from the decision z. 0 = disabled.
  max_entry_zscore: 3.5       # regime-shift guard: refuse an entry when |z|
                              # exceeds this (a blowout is rarely a reversion).
                              # 0 = disabled. Keep below stop_zscore.

# Probability / EV / cost gate (OU gambler's-ruin model).
filters:
  enable_probability_filter: true
  commission_basis: per_lot   # per_lot | per_order
  min_win_probability: 0.6
  min_expected_value: 0
  brokerage_per_lot: 20       # Arrow charges a flat ₹20 per lot per order (per
                              # leg, one way). No maker/taker distinction. The
                              # model applies ×2 legs and ×2 (entry+exit), so a
                              # 1-lot spread round trip ≈ ₹80.
  slippage_per_lot: 5         # INR per lot per leg, one way
  time_stop_half_lives: 3.0   # exit if held longer than this × half-life
  half_life_min_sec: 0        # allowed-range lower bound (0 = none)
  half_life_max_sec: 0        # allowed-range upper bound (0 = none)

# Risk management.
risk:
  lots_per_trade: 1
  max_contracts_per_leg: 5    # hard position cap per leg
  max_slippage_pct: 0.5
  max_daily_loss: 0           # INR; 0 = disabled. Halts new entries when today's
                              # realized P&L ≤ −this.

# Only trade inside this window (IST).
trading_hours:
  enabled: false
  start_hour: 9
  start_min: 15
  end_hour: 15
  end_min: 30

# LIVE order execution (SpreadExecutor).
execution:
  product: NRML
  order_type: limit
  default_lots: 1
  cooldown_sec: 300
  use_limit_orders: true      # place legs as LIMIT (priced off LTP), not MARKET
  limit_offset_pct: 0.05      # % through LTP for a marketable limit (caps slippage)
  amend_step_pct: 0.05        # extra % added each amendment to chase the fill
  amend_interval_sec: 1.5     # re-price the resting limit this often while waiting
  fill_timeout_sec: 5         # wait this long for a limit before escalating
  poll_interval_sec: 0.4      # order-status (fill) poll cadence
  limit_to_market: true       # on timeout, cancel the limit and re-send as MARKET
  # Order-status safety: a status read that comes back UNKNOWN is treated as a
  # TRANSIENT glitch — we poll through a grace window and never fabricate a fill.
  unknown_status_grace_polls: 3   # consecutive UNKNOWN reads tolerated before deciding
  assume_fill_on_unknown: false   # true ONLY for a broker with no status API (then a
                                  # persistent UNKNOWN is assumed filled, unconfirmed)
  max_exit_failures: 3        # after N consecutive failed auto-exits, HALT further
                              # retries and alert (position kept) instead of
                              # cancel-spamming the broker. 0 = retry indefinitely.
  exit_retry_backoff_sec: 5   # exponential backoff between failed exit retries:
                              # base × 2^(n-1). 0 = retry every tick (no backoff).
  exit_retry_backoff_max_sec: 60  # cap on the backoff delay.
  verify_flat_before_entry: true   # skip entry if a leg already has a position
  # ── live_sim: simulated broker the real executor runs against (no real orders) ─
  sim_slippage_pct: 0.03      # max adverse slippage on simulated fills (%)
  sim_slow_prob: 0.25         # chance a limit needs a couple polls/amendment to fill
  sim_reject_prob: 0.0        # chance a leg is rejected at placement
  sim_orphan_prob: 0.0        # chance a leg never fills → exercise orphan recovery
  sim_default_lot_size: 75    # lot size when no live broker is connected

# Order routing. dry_run never reaches a broker; live_sim runs the REAL executor
# against a simulated broker (no real orders); live transmits to Arrow.
# Fail-safe: anything not exactly "live"/"live_sim" is treated as dry_run.
mode: dry_run          # dry_run | live_sim | live
